version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: bitarcade-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  app:
    build: .
    container_name: bitarcade-backend
    restart: always
    depends_on:
      - redis
    ports:
      - "5050:5050"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=5050
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production

volumes:
  redis_data:
